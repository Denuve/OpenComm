name: Backend CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@/v4

      - name: Configure Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies(Clean Install)
        run: npm ci
        working-directory: ./backend

      - name: Package's Security Audit (Supply Chain Security)
        run: npm audit --audit-level=high
        working-directory: ./backend
        continue-on-error: true

      - name: Type-Check
        run: npm run type-check
        working-directory: ./backend

      - name: Build Test
        run: npm run build
        working-directory: ./backend

      - name: Build Docker Image Test(Multi-Stage Validation)
        run: docker build --target development -t opencomm-backend:dev ./backend

